name: ENS Compliance-as-Code Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  iac-security-scan:
    name: Terraform IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Escanear infra/main.tf con Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          soft_fail: true

  ens-audit:
    name: ENS-Cloud-Auditor (Mock Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests unitarios (pytest)
        run: |
          python -m pytest -v

      - name: Ejecutar ENS-Cloud-Auditor (Baseline 60%)
        run: |
          python -m src.main --mock --threshold 60

      - name: Subir Informes de Auditoría (HTML, CSV, JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ens-audit-reports
          path: output/

          